<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>apeSketch pair</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/brand/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --paper: #f4f0e6;
      --paper-alt: #ede7d6;
      --ink: #101820;
      --cream: #f4eee1;
      --navy: #0b2540;
      --accent: #c64a1a;
      --muted: rgba(16, 24, 32, 0.55);
      --hair: rgba(16, 24, 32, 0.18);
    }
    @font-face {
      font-family: "Archivo Narrow";
      src: url("/brand/fonts/ArchivoNarrow-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--hair) 1px, transparent 1px),
        linear-gradient(90deg, var(--hair) 1px, transparent 1px);
      background-size: 72px 72px;
      background-position: center center;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    main {
      width: min(420px, 100%);
      background: var(--paper);
      border: 1px solid var(--hair);
      padding: 28px 24px 22px;
      position: relative;
      box-shadow: 0 18px 40px rgba(16, 24, 32, 0.08);
    }
    main::before,
    main::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1px solid var(--accent);
      pointer-events: none;
    }
    main::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
    main::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }

    .lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 4px 0 18px;
    }
    .lockup img {
      width: 168px;
      height: 168px;
      display: block;
      background: var(--paper);
    }
    .lockup h1 {
      margin: 10px 0 0;
      font-family: "Archivo Narrow", "Segoe UI", system-ui, sans-serif;
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .lockup .tag {
      margin: 8px 0 0;
      font-family: "Archivo Narrow", "Segoe UI", system-ui, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }
    .room {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .room-label {
      font-family: "Archivo Narrow", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .room-code {
      font: 700 1.7rem/1 "Archivo Narrow", "Segoe UI", sans-serif;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .qr-ring {
      width: 268px;
      height: 268px;
      margin: 0 auto 16px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background: var(--paper);
    }
    .qr-ring::before,
    .qr-ring::after {
      content: "";
      position: absolute;
      background: var(--accent);
      pointer-events: none;
    }
    .qr-ring::before { width: 1px; height: 12px; top: -1px; left: 50%; transform: translateX(-50%); }
    .qr-ring::after { width: 12px; height: 1px; left: -1px; top: 50%; transform: translateY(-50%); }
    #qr-wrap {
      display: grid;
      place-items: center;
      width: 216px;
      height: 216px;
    }
    #qr-wrap svg, #qr-wrap img {
      width: 216px;
      height: 216px;
      display: block;
    }
    #qr-wrap .err {
      color: var(--accent);
      text-align: center;
      font-size: 0.85rem;
      padding: 8px;
    }
    .meta {
      font-size: 0.82rem;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
    }
    .meta a { color: var(--accent); }
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--hair);
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
    }
    .back:hover { border-color: var(--accent); color: var(--accent); }
    .back svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
    }
    button, .btn {
      border: 1px solid var(--hair);
      background: var(--paper);
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
      font: 650 0.85rem/1 "Archivo Narrow", "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
    }
    button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
    details {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    pre {
      margin: 8px 0 0;
      padding: 10px;
      background: var(--paper-alt);
      border: 1px solid var(--hair);
      overflow: auto;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <a class="back" id="back-board" href="/" title="Back to board" aria-label="Back to board">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/><path d="M9 12h11"/></svg>
      </a>
    </div>
    <div class="lockup">
      <img src="/brand/mark.png" alt="" width="168" height="168" />
      <h1>apeSketch</h1>
      <p class="tag">Ink bridge</p>
    </div>
    <p class="lead">Scan with your phone (same Wi‑Fi) to open this board.</p>
    <div class="room">
      <span class="room-label">Room</span>
      <span class="room-code" id="room">…</span>
    </div>
    <div class="qr-ring">
      <div id="qr-wrap">
        <span class="err">Loading QR…</span>
      </div>
    </div>
    <div class="meta">
      Board: <a id="board" href="#">…</a>
    </div>
    <div class="actions">
      <a class="btn" id="open-board" href="#">Open board</a>
      <button type="button" id="copy-url">Copy URL</button>
      <button type="button" id="refresh-qr">Refresh QR</button>
    </div>
    <details>
      <summary>Technical details</summary>
      <p>WebSocket: <code id="ws">…</code></p>
      <pre id="raw"></pre>
    </details>
  </main>
  <script>
    const qrWrap = document.getElementById("qr-wrap");
    const roomEl = document.getElementById("room");
    const boardEl = document.getElementById("board");
    const openBoard = document.getElementById("open-board");
    const wsEl = document.getElementById("ws");
    const rawEl = document.getElementById("raw");

    function showQr(boardUrl) {
      fetch("/api/pair/qr.svg?t=" + Date.now())
        .then(async (res) => {
          if (!res.ok) {
            const body = await res.text();
            throw new Error(body || ("HTTP " + res.status));
          }
          return res.text();
        })
        .then((svg) => {
          qrWrap.innerHTML = svg;
          const el = qrWrap.querySelector("svg");
          if (el) {
            el.setAttribute("width", "216");
            el.setAttribute("height", "216");
            el.style.display = "block";
          }
        })
        .catch((err) => {
          qrWrap.innerHTML =
            '<div class="err">QR unavailable (' +
            String(err).slice(0, 180) +
            "). Open this URL on your phone:<br/><br/><strong>" +
            boardUrl +
            "</strong><br/><br/>If this host was started before QR support, restart:<br/><code>python -m apeSketch</code></div>";
        });
    }

    function loadPair() {
      return fetch("/api/pair")
        .then((r) => r.json())
        .then((info) => {
          roomEl.textContent = info.room;
          boardEl.href = info.board;
          boardEl.textContent = info.board;
          openBoard.href = info.board;
          wsEl.textContent = info.ws;
          rawEl.textContent = JSON.stringify(info, null, 2);
          showQr(info.board);
          return info;
        });
    }

    document.getElementById("copy-url").onclick = async () => {
      const url = boardEl.href;
      try {
        await navigator.clipboard.writeText(url);
        document.getElementById("copy-url").textContent = "Copied";
        setTimeout(() => {
          document.getElementById("copy-url").textContent = "Copy URL";
        }, 1200);
      } catch (_) {
        prompt("Copy board URL", url);
      }
    };

    document.getElementById("refresh-qr").onclick = () => loadPair();
    document.getElementById("back-board").onclick = (ev) => {
      if (window.opener && !window.opener.closed) {
        ev.preventDefault();
        window.opener.focus();
        window.close();
        return;
      }
      if (history.length > 1) {
        ev.preventDefault();
        history.back();
      }
    };
    loadPair().catch((err) => {
      qrWrap.innerHTML = '<div class="err">' + String(err) + "</div>";
    });
  </script>
</body>
</html>
